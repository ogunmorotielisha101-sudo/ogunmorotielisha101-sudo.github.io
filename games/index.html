<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Arcade</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="hub.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#0f2027,#203a43 55%,#2c5364);color:#fff;min-height:100vh;padding:18px 14px 30px}
h1{font-size:24px;margin-bottom:4px}.sub{opacity:.75;font-size:14px;margin-bottom:16px}
.bar{display:flex;gap:10px;margin-bottom:16px}.pill{flex:1;background:rgba(255,255,255,.1);border-radius:14px;padding:12px;text-align:center}.pill b{display:block;font-size:22px}
button.daily{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#ffcc33;color:#3a2a00;margin-bottom:18px}button.daily:disabled{background:#556;color:#ccc}
.card{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border-radius:18px;padding:14px;margin-bottom:12px;text-decoration:none;color:#fff}
.ico{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px}
.card h2{font-size:18px}.card p{font-size:13px;opacity:.75}.card .best{font-size:12px;color:#ffcc33;margin-top:3px}
h3{margin:22px 0 10px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:0;border-radius:10px;padding:8px;background:rgba(255,255,255,.1);color:#fff}.tabs button.on{background:#4fc3f7;color:#012}
ol{list-style:none;background:rgba(255,255,255,.06);border-radius:14px;padding:6px 12px}ol li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}ol li:last-child{border:0}
.credit{text-align:center;font-size:11px;opacity:.45;margin-top:22px}
.invite{margin-top:18px;background:rgba(255,255,255,.08);border-radius:14px;padding:14px;font-size:14px}.invite button{margin-top:10px;width:100%;border:0;border-radius:12px;padding:12px;background:#4fc3f7;font-weight:700}
</style></head><body>
<h1>🎮 Flappy Arcade</h1><div class="sub" id="hi">Play, earn coins, top the leaderboard.</div>
<div class="bar"><div class="pill"><b id="coins">–</b>coins</div><div class="pill"><b id="inv">–</b>friends invited</div></div>
<button class="daily" id="daily">🎁 Claim daily bonus</button>
<a class="card" href="../flappy/"><div class="ico" style="background:#4ec0ca">🐦</div><div><h2>Flappy Bird</h2><p>Tap to fly through the pipes.</p><div class="best" id="b-flappy"></div></div></a>
<a class="card" href="glider.html"><div class="ico" style="background:linear-gradient(160deg,#7b3fa0,#f0717a)">✈️</div><div><h2>Sky Glider</h2><p>Hold to climb, release to dive. Grab the stars.</p><div class="best" id="b-glider"></div></div></a>
<h3>🏆 Leaderboard</h3>
<div class="tabs"><button data-g="flappy" class="on">Flappy</button><button data-g="glider">Sky Glider</button></div>
<ol id="top"><li>Loading…</li></ol>
<div class="invite">👥 Invite friends: you get <b>100 coins</b> for each one who joins.<button id="share">Share my invite link</button></div>
<script>
var link = "https://t.me/Flappy2026Bot";
function load(){ Hub.me().then(function(m){ document.getElementById("hi").textContent="Hi "+m.name+"! Play, earn coins, top the leaderboard.";
  document.getElementById("coins").textContent=m.coins; document.getElementById("inv").textContent=m.invited; link=m.invite;
  var d=document.getElementById("daily"); d.disabled=!m.canDaily; d.textContent=m.canDaily?"🎁 Claim daily bonus (+50)":"✅ Daily bonus claimed";
  ["flappy","glider"].forEach(function(g){ if(m.best[g]) document.getElementById("b-"+g).textContent="Your best: "+m.best[g]; });
 }).catch(function(e){ var d=document.getElementById("daily"); if(!Hub.inTelegram){ d.disabled=true; d.textContent="Open in Telegram to earn coins"; } else { d.disabled=false; d.textContent="⚠️ Server busy, tap to retry"; d.onclick=function(){ d.onclick=claim; load(); }; } }); }
function claim(){ var d=document.getElementById("daily"); d.disabled=true; Hub.daily().then(function(r){ Hub.haptic("medium"); alert(r.msg); load(); }).catch(function(){ d.disabled=false; alert("Couldn't reach the server. Please try again."); }); }
document.getElementById("daily").onclick=claim;
function showTop(g){ document.querySelectorAll(".tabs button").forEach(function(b){b.className=b.dataset.g==g?"on":"";});
 Hub.top(g).then(function(r){ var o=document.getElementById("top"); o.innerHTML=r.top.length?"":"<li>No scores yet. Be first!</li>";
  r.top.forEach(function(e,i){ var li=document.createElement("li"); li.innerHTML="<span></span><b></b>"; li.firstChild.textContent=(["🥇","🥈","🥉"][i]||(i+1)+".")+" "+e.name; li.lastChild.textContent=e.score; o.appendChild(li); }); }).catch(function(){ document.getElementById("top").innerHTML="<li>Can't reach the server. <a href=\"#\" onclick=\"showTop('"+g+"');return false\" style=\"color:#4fc3f7\">Retry</a></li>"; }); }
document.querySelectorAll(".tabs button").forEach(function(b){ b.onclick=function(){showTop(b.dataset.g);}; });
document.getElementById("share").onclick=function(){ var u="https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent("Play Flappy Bird and Sky Glider with me on Telegram! 🎮");
 if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.openTelegramLink) Telegram.WebApp.openTelegramLink(u); else window.open(u); };
load(); showTop("flappy");
</script>
<div class="credit">Created by Elisha</div></body></html>

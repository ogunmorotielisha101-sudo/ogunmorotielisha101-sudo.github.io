<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Penalty King 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js" async onload="try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.disableVerticalSwipes&&Telegram.WebApp.disableVerticalSwipes();}catch(e){}"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#04070d;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
#gl,#fx{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#fx{pointer-events:none}
#hud{position:fixed;left:0;right:0;top:0;padding:10px 14px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0));pointer-events:none}
#hud .l b{font-size:15px;display:block}#hud .l span{font-size:12px;opacity:.75}
#dots{display:flex;gap:8px}#dots i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.25);display:block;box-sizing:border-box}
#dots i.g{background:#2ecc71}#dots i.m{background:#e74c3c}#dots i.c{border:2px solid #fff}
#hud .r{text-align:right}#hud .r b{font-size:22px;display:block}#hud .r span{font-size:11px;opacity:.7}
#msg{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;opacity:0}
#msg h2{margin:0;font-size:50px;font-weight:900;letter-spacing:1px;text-shadow:0 4px 14px rgba(0,0,0,.7),0 0 2px #000}
#msg p{margin:4px 0 0;font-weight:700;font-size:17px;text-shadow:0 2px 6px #000}
#msg.show{animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards}
#msg.good h2{color:#7CFC9A}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
#hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-weight:700;font-size:14px;text-shadow:0 2px 6px #000;pointer-events:none}
#rep{position:fixed;top:70px;left:14px;background:#e01b24;padding:4px 10px;border-radius:4px;font-weight:900;font-size:13px;letter-spacing:2px;display:none;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,50,22,.75),rgba(0,10,5,.94));text-align:center;padding:24px;box-sizing:border-box;z-index:5}
#ov h1{font-size:44px;margin:0 0 6px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#ov h1 span{color:#7CFC9A}
#ov p{opacity:.92;max-width:330px;line-height:1.45;margin:6px 0}
#ov button{margin-top:22px;font-size:20px;font-weight:800;padding:14px 46px;border:0;border-radius:40px;background:linear-gradient(#22c25a,#139a43);color:#fff;box-shadow:0 6px 0 #0b5e28;letter-spacing:.5px}
#ov button:active{transform:translateY(4px);box-shadow:0 2px 0 #0b5e28}
.tag{font-size:12px;opacity:.6;margin-top:18px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04070d;z-index:9;font-weight:700;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:100%;max-width:420px;max-height:62vh;overflow:auto}
.tm{margin:0!important;padding:8px 2px!important;font-size:11px!important;font-weight:700!important;border-radius:12px!important;background:rgba(255,255,255,.1)!important;box-shadow:none!important;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;border:1px solid rgba(255,255,255,.15)!important}
.tm span{font-size:28px}.tm small{font-size:8px;color:#ffd54f;letter-spacing:-1px}
#ov button.alt{background:rgba(255,255,255,.14);box-shadow:0 6px 0 rgba(0,0,0,.35);margin-top:12px}
#ov button.back{background:none;box-shadow:none;font-size:15px;margin-top:10px;padding:8px 20px;opacity:.8}
#vs{font-size:14px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}

#ov{justify-content:flex-start!important;overflow-y:auto;padding:64px 18px 30px!important;background:radial-gradient(ellipse at 50% 30%,rgba(10,60,30,.55),rgba(2,8,6,.92) 75%)!important}
#ov>*:first-child.top+*{margin-top:auto}
.top{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:6;pointer-events:none}
.chip{background:rgba(0,0,0,.55);border:1px solid rgba(255,215,64,.45);padding:6px 14px;border-radius:30px;font-size:15px;backdrop-filter:blur(6px);box-shadow:0 0 12px rgba(255,200,40,.15)}
.chip b{color:#ffd54f}
.crown{font-size:46px;margin-top:4vh;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,200,40,.7))}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
h1.logo{font-size:58px!important;line-height:.92;font-weight:900;font-style:italic;margin:0!important;letter-spacing:2px;padding:0 14px;background:linear-gradient(180deg,#fff 30%,#c8ffd8);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #0b5e28) drop-shadow(0 10px 18px rgba(0,0,0,.6))}
#ov h1.logo span{background:linear-gradient(180deg,#fff3a0,#ffc107 55%,#ff8f00);-webkit-background-clip:text;color:transparent;font-size:74px;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 16px rgba(255,190,40,.8))}}
.lead{font-size:14px;opacity:.85!important;letter-spacing:.3px}
.tick{width:100%;max-width:420px;overflow:hidden;margin:14px 0 2px;-webkit-mask:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.tick div{display:flex;gap:8px;width:max-content;animation:tk 40s linear infinite}
.tick .fl{width:36px;height:24px}
@keyframes tk{to{transform:translateX(-50%)}}
.fl{width:30px;height:20px;border-radius:3px;object-fit:cover;box-shadow:0 1px 4px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.2);vertical-align:middle;display:inline-block}
.fl.big{width:72px;height:48px;border-radius:6px}
#ov button.big{background:linear-gradient(180deg,#3df07a,#14a64a 60%,#0f8a3c);box-shadow:0 6px 0 #0a5a27,0 10px 24px rgba(30,220,100,.35);animation:pulse 1.8s ease-in-out infinite;min-width:250px}
@keyframes pulse{50%{transform:scale(1.04)}}
#ov button.gold{background:linear-gradient(180deg,#ffe082,#ffb300 60%,#ff8f00);color:#3a2000;box-shadow:0 6px 0 #a35b00;margin-top:12px;min-width:250px}
#ov button.alt{min-width:250px}
.tag{font-size:12px!important;opacity:.6;margin-top:20px!important}
.sub{margin:6px 0 10px;font-size:18px;letter-spacing:.5px;color:#c8ffd8}.sub small{font-size:11px;opacity:.6;font-weight:400}
.grid{max-height:none!important;gap:8px!important}
.tm{padding:10px 2px!important;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04))!important;transition:transform .1s}
.tm:active{transform:scale(.94)}.tm .fl{width:40px;height:27px;margin-bottom:3px}.tm b{font-size:11px;white-space:nowrap}
.stage{text-transform:uppercase;letter-spacing:3px;font-size:13px;color:#ffd54f;opacity:1!important;margin-top:6vh!important}
.vsbox{display:flex;align-items:center;gap:16px;margin:10px 0}.vsbox>div{display:flex;flex-direction:column;align-items:center;gap:6px;width:110px}.vsbox b{font-size:16px}.vsbox small{font-size:10px;color:#ffd54f}
.vsbox .v{font-size:28px;font-weight:900;font-style:italic;color:#ffd54f;text-shadow:0 0 14px rgba(255,200,40,.6)}
.pl{font-size:13px;opacity:.7!important;margin-top:14px!important}
.pus{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:360px}
#ov .pu{margin:0;padding:8px 10px;font-size:24px;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:none;border:2px solid rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;width:100px}
#ov .pu small{font-size:10px;font-weight:600;margin-top:2px}
#ov .pu.on{border-color:#ffd54f;background:rgba(255,200,40,.2);box-shadow:0 0 14px rgba(255,200,40,.45)}
.shop{display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px}
.it{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px;text-align:left}
.it .ic{font-size:30px;width:40px;text-align:center}.it .tx{flex:1;display:flex;flex-direction:column}.it .tx b{font-size:14px}.it .tx span{font-size:11px;opacity:.75}.it .tx em{font-size:10px;color:#7CFC9A;font-style:normal;margin-top:2px}
#ov .buy{margin:0;padding:8px 12px;font-size:14px;border-radius:20px;background:linear-gradient(180deg,#ffe082,#ffb300);color:#3a2000;box-shadow:0 3px 0 #a35b00;white-space:nowrap}
#ov .buy.no{filter:grayscale(.8) brightness(.7)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:400px}
#ov .sk{margin:0;padding:10px 2px;font-size:12px;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:none;border:2px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:4px}
#ov .sk i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:0 3px 8px rgba(0,0,0,.5)}#ov .sk small{font-size:10px;color:#ffd54f}#ov .sk.on{border-color:#7CFC9A}
.burst{font-size:64px;margin-top:6vh;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}.burst.trophy{font-size:90px;filter:drop-shadow(0 0 24px rgba(255,200,40,.8))}
h1.gold{background:linear-gradient(180deg,#fff3a0,#ffb300);-webkit-background-clip:text;color:transparent}
.sc{display:flex;gap:18px;justify-content:center;margin:8px 0;font-size:14px}.sc span{background:rgba(255,255,255,.08);padding:6px 14px;border-radius:12px}
.bonus{color:#ffd54f;font-weight:800;font-size:16px;animation:pop .6s .2s both cubic-bezier(.2,1.6,.4,1)}
#vs{display:flex!important;align-items:center;gap:5px}#vs .fl{width:22px;height:15px}#vs i{opacity:.6;font-style:normal;font-size:11px}
</style>
</head>
<body>
<canvas id="gl"></canvas><canvas id="fx"></canvas>
<div id="hud" style="display:none"><div class="l"><b id="vs"></b><span id="st"></span></div><div id="dots"></div><div class="r"><b id="sc">0</b><span id="bs"></span></div></div>
<div id="msg"><h2></h2><p></p></div><div id="hint"></div><div id="rep">REPLAY</div>
<div id="ov"></div><div id="load">LOADING STADIUM…</div>
<script>(function(){function go(v){var s=document.createElement("script");s.type="module";s.src="game.js?v="+v;document.body.appendChild(s);}fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){go(j.v)}).catch(function(){go("8")});})();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Penalty King – Prototype</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#06120c;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,60,25,.78),rgba(0,15,6,.93));color:#fff;text-align:center;padding:24px;box-sizing:border-box}
#ov h1{font-size:42px;margin:0 0 6px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#ov h1 span{color:#7CFC9A}
#ov p{opacity:.92;max-width:330px;line-height:1.45;margin:6px 0}
#ov button{margin-top:22px;font-size:20px;font-weight:800;padding:14px 46px;border:0;border-radius:40px;background:linear-gradient(#22c25a,#139a43);color:#fff;box-shadow:0 6px 0 #0b5e28;letter-spacing:.5px}
#ov button:active{transform:translateY(4px);box-shadow:0 2px 0 #0b5e28}
.tag{font-size:12px;opacity:.6;margin-top:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div>
<script>
(function(){
const tg=window.Telegram&&Telegram.WebApp; if(tg){try{tg.ready();tg.expand();}catch(e){}}
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
const D=7,CAMH=3.0,GW=3.66,GH=2.44,KZ=10.75,BR=.11;
let W,H,DPR,F,CY,crowd=[],grassPat=null;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function P(x,y,z){const s=F/(z+D);return [W/2+x*s,CY+(CAMH-y)*s,s];}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 F=Math.min(W*0.94,H*0.6)*(11+D)/(GW*2);CY=H*0.8-CAMH*F/D;buildCrowd();buildGrass();}
function buildCrowd(){crowd=[];const shirts=['#0a8f3c','#0a8f3c','#0a8f3c','#f2f2f2','#f2f2f2','#e8c547','#1d3557','#c8102e','#0a8f3c'];const skins=['#3b2416','#4a2c1a','#5c3a21','#6b4426','#2e1b10'];
 for(let r=0;r<24;r++){const z=18+r*.85,y=1.1+r*.52,s=F/(z+D),xm=(W/2+30)/s;for(let x=-xm;x<xm;x+=.62){if(Math.random()<.06)continue;
  crowd.push({x:x+(Math.random()-.5)*.2,y,z,r,sh:shirts[(Math.random()*shirts.length)|0],sk:skins[(Math.random()*skins.length)|0],flag:Math.random()<.045,ph:Math.random()*6.28,hat:Math.random()<.12});}}}
function buildGrass(){const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');const id=g.createImageData(96,96);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*40;id.data[i]=v*.4;id.data[i+1]=v;id.data[i+2]=v*.3;id.data[i+3]=40;}g.putImageData(id,0,0);grassPat=ctx.createPattern(c,'repeat');}
addEventListener('resize',resize);resize();

const STAGES=[
 {name:'Group Stage',opp:'Ghana',kit:'#f4f4f4',kit2:'#c8102e',glove:'#ff7a00',need:3,react:.33,noise:1.1,guess:.18,dd:.56},
 {name:'Quarter-final',opp:'Cameroon',kit:'#0b7a3e',kit2:'#fcd116',glove:'#fcd116',need:3,react:.28,noise:.9,guess:.26,dd:.52},
 {name:'Semi-final',opp:'Egypt',kit:'#c8102e',kit2:'#111',glove:'#fff',need:4,react:.24,noise:.72,guess:.33,dd:.48},
 {name:'Final',opp:'Morocco',kit:'#b31b26',kit2:'#006233',glove:'#39ff88',need:4,react:.2,noise:.58,guess:.4,dd:.45}];
let stage=0,shot=0,results=[],score=0,best=+(localStorage.getItem('pk_best')||0),history=[];
let phase='menu',ball=null,K=null,kicker=null,msg=null,trail=[],swipe=null,pending=null,netHit={x:0,y:0,a:0},shake=0,confetti=[],tPhase=0,mood={type:'idle',t:0},flashes=[],clock=0;

// ---------- audio ----------
let AC=null,crowdNode=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();startAmb();}catch(e){}}return AC;}
function nbuf(d){const a=AC,n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=l*.6+(Math.random()*2-1)*.4;ch[i]=l;}return b;}
function startAmb(){const a=AC;const s=a.createBufferSource();s.buffer=nbuf(3);s.loop=true;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=.5;const g=a.createGain();g.gain.value=.05;s.connect(f).connect(g).connect(a.destination);s.start();crowdNode=g;}
function swellCrowd(v,d){if(!crowdNode)return;const t=AC.currentTime;crowdNode.gain.cancelScheduledValues(t);crowdNode.gain.setValueAtTime(crowdNode.gain.value,t);crowdNode.gain.linearRampToValueAtTime(v,t+.2);crowdNode.gain.linearRampToValueAtTime(.05,t+d);}
function tone(f,d,type,vol,slide){const a=AC;if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);g.gain.value=vol||.3;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d);}
function hit(d,vol,freq){const a=AC;if(!a)return;const s=a.createBufferSource();s.buffer=nbuf(d);const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=a.createGain();g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(f).connect(g).connect(a.destination);s.start();}
const SFX={kick(){tone(130,.2,'sine',.7,45);hit(.07,.4,2500);},goal(){hit(.35,.3,3500);swellCrowd(.55,2.8);},save(){tone(200,.12,'triangle',.35,110);hit(.08,.3,1200);swellCrowd(.18,1.2);},catch(){tone(160,.1,'sine',.4,90);swellCrowd(.14,1);},post(){tone(1250,.6,'square',.1,1190);tone(1870,.5,'sine',.15);swellCrowd(.25,1.4);},miss(){swellCrowd(.15,1.2);},whistle(){tone(2900,.12,'sine',.18,2750);setTimeout(()=>tone(2900,.4,'sine',.18,2700),160);},tension(){swellCrowd(.1,1);}};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

// ---------- flow ----------
function overlay(html){ov.innerHTML=html;ov.style.display='flex';}
function hideOv(){ov.style.display='none';}
function menu(){phase='menu';overlay(`<h1>PENALTY <span>KING</span></h1><p>Win the cup for Nigeria 🇳🇬<br>Beat 4 keepers, each smarter than the last.</p><p style="font-size:14px">👆 <b>Swipe</b> to shoot. Longer = higher.<br>Faster = harder to save, less accurate.<br>🌀 <b>Curve your swipe</b> to bend it round the keeper.</p><button id="go">PLAY</button><div class="tag">Prototype v2 · Best ${best}</div>`);
 document.getElementById('go').onclick=()=>{ac();stage=0;score=0;history=[];startStage();};}
function startStage(){const S=STAGES[stage];shot=0;results=[];newShot();phase='menu';overlay(`<p style="opacity:.7">${S.name}</p><h1>🇳🇬 vs ${S.opp}</h1><p>Score <b>${S.need} of 5</b> to go through.</p><button id="go">KICK OFF</button>`);
 document.getElementById('go').onclick=()=>{hideOv();SFX.whistle();phase='aim';tPhase=0;};}
function newShot(){phase='aim';ball={x:0,y:BR,z:0,t:0,spin:0,vx:0,vy:0,vz:0,ghost:[]};K={mode:'idle',hx:0,hy:.82,th:0,x0:0,tau:-9,P:[0,1],side:1,held:false};kicker={t:-1,react:null};trail=[];msg=null;netHit.a=0;tPhase=0;mood={type:'idle',t:0};}
function endStage(){const S=STAGES[stage];const g=results.filter(r=>r).length;phase='menu';
 if(score>best){best=score;localStorage.setItem('pk_best',best);}
 const again=()=>{stage=0;score=0;history=[];startStage();};
 if(g>=S.need){ if(stage===STAGES.length-1){burst(260);overlay(`<h1>🏆 CHAMPIONS!</h1><p>Nigeria lift the cup.</p><p>Score <b>${score}</b> · Best ${best}</p><button id="go">PLAY AGAIN</button>`);document.getElementById('go').onclick=again;}
  else{overlay(`<h1>✅ Through!</h1><p>${g}/5 against ${S.opp}.</p><p>Score <b>${score}</b></p><button id="go">NEXT: ${STAGES[stage+1].name.toUpperCase()}</button>`);document.getElementById('go').onclick=()=>{stage++;startStage();};}}
 else{overlay(`<h1>❌ Knocked out</h1><p>${g}/5 against ${S.opp} in the ${S.name}. Needed ${S.need}.</p><p>Score <b>${score}</b> · Best ${best}</p><button id="go">TRY AGAIN</button>`);document.getElementById('go').onclick=again;}}

// ---------- input ----------
function pt(e){return {x:e.clientX,y:e.clientY,t:performance.now()};}
cv.addEventListener('pointerdown',e=>{if(phase!=='aim')return;swipe=[pt(e)];trail=[swipe[0]];});
cv.addEventListener('pointermove',e=>{if(!swipe)return;const p=pt(e);swipe.push(p);trail.push(p);if(trail.length>40)trail.shift();});
addEventListener('pointerup',()=>{if(!swipe)return;const s=swipe;swipe=null;if(s.length<2)return;prepShot(s);});

function prepShot(s){const a=s[0],b=s[s.length-1];const vx=b.x-a.x,vy=b.y-a.y;const len=Math.hypot(vx,vy);
 if(vy>-30||len<40){trail=[];return;}
 const dur=Math.max(40,b.t-a.t),power=Math.min(1,(len/dur)/2.6);
 const ux=vx/len,uy=vy/len,nx=-uy,ny=ux;let off=0;for(const p of s){const d=(p.x-a.x)*nx+(p.y-a.y)*ny;if(Math.abs(d)>Math.abs(off))off=d;}
 const curve=clamp(off/len*9,-2.6,2.6);
 let tx=(vx/-vy)*6.6,ty=Math.max(.12,(len/(H*.42))*2.35);
 const err=power>.82?(power-.82)*3.2:0;tx+=(Math.random()-.5)*2*err;ty+=(Math.random()-.5)*2*err;
 pending={tx,ty,curve,power,T:clamp(1.02-power*.6,.42,1)};
 phase='runup';tPhase=0;kicker.t=0;SFX.tension();}

function launch(){const p=pending;Object.assign(ball,{tx:p.tx,ty:p.ty,curve:p.curve,T:p.T,t:0,spin:p.curve});
 planKeeper(p.tx,p.ty,p.T,p.curve,p.power);phase='flight';tPhase=0;SFX.kick();buzz(20);
 for(let i=0;i<14;i++)flashes.push({i:(Math.random()*crowd.length)|0,t:Math.random()*.6});
 history.push(Math.sign(p.tx));if(history.length>6)history.shift();}

// ---------- keeper ----------
function planKeeper(tx,ty,T,curve,power){const S=STAGES[stage];const bias=history.reduce((a,b)=>a+b,0)/(history.length||1);let px,py,start;
 if(Math.random()<S.guess){const side=Math.random()<.5+bias*.35?1:-1;px=side*(1.5+Math.random()*1.6);py=.3+Math.random()*1.6;start=.02;}
 else{const n=S.noise*(1+Math.abs(curve)*.35+power*.3);px=tx+(Math.random()-.5)*n*1.6;py=ty+(Math.random()-.5)*n;start=S.react+Math.random()*.06;}
 py=clamp(py,.15,2.5);px=clamp(px,-4.2,4.2);
 const x0=K.hx;K.x0=x0;K.P=[px,py];K.start=start;K.dd=S.dd;K.side=px>=x0?1:-1;const dx=px-x0;
 if(Math.abs(dx)<.75&&py<1.85){K.mode='catch';}
 else if(Math.abs(dx)<1&&py>=1.85){K.mode='jump';K.hyT=clamp(py-1.25,.82,1.35);}
 else{K.mode='dive';let th=Math.atan2(dx,Math.max(.25,py-.45));th=clamp(th,-1.48,1.48);K.thT=th;
  let hx=px-Math.sin(th)*1.18,hy=py-Math.cos(th)*1.18;hx=x0+clamp(hx-x0,-1.75,1.75);hy=clamp(hy,.35,1.45);K.hxT=hx;K.hyT=hy;}}

const READY={lk:[-.24,-.4],lf:[-.34,-.82],rk:[.24,-.4],rf:[.34,-.82],nk:[0,.56],hd:[0,.74],ls:[-.2,.5],rs:[.2,.5],le:[-.42,.32],re:[.42,.32],lh:[-.52,.48],rh:[.52,.48]};
const DIVE={lk:[-.1,-.43],lf:[-.06,-.87],rk:[.17,-.33],rf:[.3,-.7],nk:[0,.56],hd:[.03,.74],ls:[-.17,.52],rs:[.17,.52],le:[-.13,.84],re:[.12,.86],lh:[-.09,1.12],rh:[.11,1.13]};
function rot(x,y,th){const c=Math.cos(th),s=Math.sin(th);return [x*c+y*s,-x*s+y*c];}
function updateKeeper(dt){const k=K;
 if(phase==='aim'||phase==='runup'||phase==='menu'){k.mode='idle';k.hx=Math.sin(clock*1.6)*.32;let bob=Math.abs(Math.sin(clock*6.5))*.03;
  if(phase==='runup'){const q=kicker.t;bob=q>.3?-.09*sm((q-.3)/.1)+.06*sm((q-.4)/.05):bob;}
  k.hy=.82+bob;k.th=0;k.tau=-9;return;}
 if(k.held&&phase==='result'){k.hy=lerp(k.hy,.92,dt*4);k.th=lerp(k.th,0,dt*4);return;}
 k.tau=tPhase-k.start;const tau=k.tau;if(tau<0)return;const p=clamp(tau/k.dd,0,1),e=1-(1-p)*(1-p);
 if(k.mode==='dive'){
  if(p<1){k.hx=lerp(k.x0,k.hxT,e);k.hy=lerp(.82,k.hyT,e)+.28*Math.sin(Math.PI*p)*Math.abs(Math.sin(k.thT));k.th=k.thT*e;}
  else{const q=sm((tau-k.dd)/.38);k.hx=k.hxT+k.side*.25*q;k.hy=lerp(k.hyT,.27,q);k.th=lerp(k.thT,k.side*1.52,q);
   if(q>=1&&!k.landed){k.landed=true;shake=Math.max(shake,.15);}}}
 else if(k.mode==='catch'){const[px,py]=k.P;k.hx=lerp(k.x0,k.x0+(px-k.x0)*.7,e);k.hy=.82+(py<.55?-.3:py>1.4?.12:0)*e;k.th=clamp((px-k.hx)*.25,-.4,.4)*e;}
 else if(k.mode==='jump'){k.hx=lerp(k.x0,k.x0+(k.P[0]-k.x0)*.6,e);k.hy=.82+(k.hyT-.82)*Math.sin(Math.PI*Math.min(1,p*.9));k.th=clamp((k.P[0]-k.hx)*.3,-.35,.35)*e;}}
function keeperJoints(){const k=K;let w=0;const tau=k.tau;
 if(k.mode==='dive'&&tau>0)w=sm(tau/k.dd*1.5);else if(k.mode==='jump'&&tau>0)w=.55*sm(tau/.25);
 const L={};for(const n in READY){const r=READY[n],d=DIVE[n];let dx=d[0]*k.side;L[n]=[lerp(r[0],dx,w),lerp(r[1],d[1],w)];}
 if(k.mode==='catch'&&tau>0&&k.P[1]<.55){const c=sm(tau/.2);L.lk=[-.32*c-.24*(1-c),-.32];L.rk=[.32*c+.24*(1-c),-.32];}
 // arms reach the target
 let wa=0;if(tau>0&&k.mode!=='idle')wa=sm(tau/.22);
 if(k.held)wa=1;
 if(wa>0){const tgt=k.held?[ball.x,ball.y]:k.P;let[lx,ly]=rot(tgt[0]-k.hx,tgt[1]-k.hy,-k.th);let vx=lx,vy=ly-.52;const m=Math.hypot(vx,vy),mx=.72;if(m>mx){vx*=mx/m;vy*=mx/m;}
  const hx=vx,hy=.52+vy,pl=Math.hypot(vx,vy)||1,px=-vy/pl,py=vx/pl;
  const lh=[hx-px*.09,hy-py*.09],rh=[hx+px*.09,hy+py*.09];
  L.lh=[lerp(L.lh[0],lh[0],wa),lerp(L.lh[1],lh[1],wa)];L.rh=[lerp(L.rh[0],rh[0],wa),lerp(L.rh[1],rh[1],wa)];
  for(const[s,e,h]of[['ls','le','lh'],['rs','re','rh']]){const mxp=(L[s][0]+L[h][0])/2,myp=(L[s][1]+L[h][1])/2;const out=s==='ls'?-1:1;L[e]=[lerp(L[e][0],mxp+out*.09,wa),lerp(L[e][1],myp-.03,wa)];}}
 else{const sw=Math.sin(clock*6.5)*.03;L.lh[1]+=sw;L.rh[1]+=sw;}
 const J={hip:[k.hx,k.hy]};for(const n in L){const[r0,r1]=rot(L[n][0],L[n][1],k.th);J[n]=[k.hx+r0,k.hy+r1];}return J;}
function segD(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy||1);t=clamp(t,0,1);return Math.hypot(px-(a[0]+t*dx),py-(a[1]+t*dy));}
function keeperTouch(bx,by){const J=keeperJoints();const segs=[['hip','nk',.22],['ls','le',.08],['le','lh',.08],['rs','re',.08],['re','rh',.08],['hip','lk',.11],['lk','lf',.09],['hip','rk',.11],['rk','rf',.09]];
 let best=null;for(const[a,b,r]of segs){const d=segD(bx,by,J[a],J[b]);if(d<r+BR&&(!best||d<best.d))best={d,part:b};}
 if(Math.hypot(bx-J.hd[0],by-J.hd[1])<.13+BR)best=best||{d:0,part:'hd'};
 for(const h of['lh','rh'])if(Math.hypot(bx-J[h][0],by-J[h][1])<.13+BR)return {d:0,part:'hand',J};
 return best?Object.assign(best,{J}):null;}

// ---------- update ----------
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;clock+=dt;update(dt);draw();requestAnimationFrame(loop);}
function update(dt){tPhase+=dt;mood.t+=dt;
 if(kicker&&kicker.t>=0)kicker.t+=dt;
 if(phase==='runup'&&kicker.t>=.425)launch();
 if(K)updateKeeper(dt);
 if(phase==='flight'){const b=ball;const prevT=b.t;b.t+=dt/b.T;const t=Math.min(b.t,1);
  b.ghost.push([b.x,b.y,b.z]);if(b.ghost.length>6)b.ghost.shift();
  b.x=b.tx*t+b.curve*4*t*(1-t);b.y=BR+(b.ty-BR)*t+Math.min(.6,b.ty*.18)*4*t*(1-t);b.z=11*t;
  if(prevT<KZ/11&&b.t>=KZ/11){const h=keeperTouch(b.x,b.y);if(h&&b.y<2.7&&Math.abs(b.x)<4.3)return result('save',h);}
  if(b.t>=1){const ax=Math.abs(b.x);
   if(ax<GW-BR&&b.y<GH-BR)return result('goal');
   if((ax>=GW-.13&&ax<GW+.16&&b.y<GH+.12)||(Math.abs(b.y-GH)<.14&&ax<GW+.16))return result('post');
   return result(b.y>GH?'over':'wide');}}
 if(phase==='result'){const b=ball;b.ghost.length&&b.ghost.shift();
  if(K.held){const J=keeperJoints();b.x=lerp(b.x,(J.lh[0]+J.rh[0])/2,dt*10);b.y=lerp(b.y,(J.lh[1]+J.rh[1])/2,dt*10);b.z=KZ-.15;}
  else if(!b.stop){b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.vy-=9.8*dt;if(b.y<BR){b.y=BR;b.vy*=-.45;b.vx*=.8;b.vz*=.75;}
   if(b.kind==='goal'&&b.z>12.5){b.z=12.5;b.vz=-.5;b.vx*=.3;}
   if(b.z>18||b.z<-3)b.stop=true;b.t+=dt*.8;}
  if(netHit.a>0)netHit.a=Math.max(0,netHit.a-dt*1.3);
  if(tPhase>2.1){shot++;const S=STAGES[stage],g=results.filter(r=>r).length;if(shot>=5||g+(5-shot)<S.need)endStage();else newShot();}}
 if(shake>0)shake=Math.max(0,shake-dt*2.5);
 for(const c of confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=300*dt;c.vx*=.99;c.r+=c.vr*dt;}confetti=confetti.filter(c=>c.y<H+20);
 for(const f of flashes)f.t-=dt;flashes=flashes.filter(f=>f.t>-.08);}

function result(kind,h){const b=ball;phase='result';tPhase=0;b.kind=kind;let pts=0,text='',sub='';
 if(kind==='goal'){const top=Math.abs(b.x)>2.6&&b.y>1.6,curl=Math.abs(b.curve)>1.1;pts=100+(top?100:0)+(curl?50:0);text=top?'TOP BINS!':'GOAL!';sub='+'+pts+(curl?'  🌀 curl bonus':'');
  b.vx=b.x*.15;b.vy=-.5;b.vz=7;netHit={x:b.x,y:b.y,a:1};SFX.goal();burst(80);shake=.45;buzz([30,40,60]);mood={type:'goal',t:0};kicker.react='goal';
  for(let i=0;i<40;i++)flashes.push({i:(Math.random()*crowd.length)|0,t:Math.random()*1.5});}
 else if(kind==='save'){const slow=b.T>.72;const canHold=(K.mode!=='dive'||slow)&&h.part==='hand';
  if(canHold){K.held=true;text='CAUGHT!';sub='Held by the '+STAGES[stage].opp+' keeper';SFX.catch();}

 ctx.beginPath();ctx.arc(p[0]+Math.cos(rot*.5)*r*.08,p[1],r*.26,0,7);ctx.fill();
 const g=ctx.createRadialGradient(p[0]-r*.4,p[1]-r*.45,r*.05,p[0],p[1],r*1.05);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=g;ctx.fillRect(p[0]-r,p[1]-r,r*2,r*2);ctx.restore();}

function drawHUD(){const S=STAGES[stage];if(phase==='menu')return;
 const g=ctx.createLinearGradient(0,0,0,62);g.addColorStop(0,'rgba(0,0,0,.65)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,62);
 ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='bold 15px system-ui';ctx.fillText('🇳🇬 vs '+S.opp,12,20);
 ctx.font='12px system-ui';ctx.globalAlpha=.75;ctx.fillText(S.name+' · need '+S.need,12,40);ctx.globalAlpha=1;
 ctx.textAlign='right';ctx.font='bold 20px system-ui';ctx.fillText(score,W-12,22);ctx.font='11px system-ui';ctx.globalAlpha=.7;ctx.fillText('BEST '+best,W-12,42);ctx.globalAlpha=1;
 for(let i=0;i<5;i++){const x=W/2-48+i*24,y=29;ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fillStyle=i<results.length?(results[i]?'#2ecc71':'#e74c3c'):'rgba(255,255,255,.25)';ctx.fill();if(i===results.length&&phase==='aim'){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}}
 if(phase==='aim'&&shot===0&&stage===0&&!trail.length){const t=(clock*1.1)%1.6;if(t<1.2){const e=t/1.2;const sx=W/2,sy=H*.9,ex=W/2+W*.14,ey=H*.62;const x=sx+(ex-sx)*e+Math.sin(e*Math.PI)*(-W*.09),y=sy+(ey-sy)*e;ctx.globalAlpha=1-e*.6;ctx.font='34px system-ui';ctx.textAlign='center';ctx.fillText('👆',x,y);ctx.globalAlpha=1;}
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('Swipe up to shoot · curve it to bend',W/2,H-22);}
 if(msg){const e=Math.min(1,tPhase*4);ctx.save();ctx.translate(W/2,H*.4);ctx.scale(.6+e*.4,.6+e*.4);ctx.textAlign='center';ctx.font='900 46px system-ui';ctx.lineWidth=7;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(msg.text,0,0);ctx.fillStyle=msg.good?'#7CFC9A':'#fff';ctx.fillText(msg.text,0,0);ctx.font='bold 16px system-ui';ctx.lineWidth=4;ctx.strokeText(msg.sub,0,36);ctx.fillStyle='#fff';ctx.fillText(msg.sub,0,36);ctx.restore();}}

newShot();menu();requestAnimationFrame(loop);
})();
